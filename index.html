@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    line-height: 1.6;
}

/* NAV */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    gap: 2rem;
    padding: 1rem;
}

nav a {
    color: #e2e8f0;
    text-decoration: none;
    font-weight: 500;
    transition: 0.3s;
}

nav a:hover {
    color: #38bdf8;
}

/* HERO */
header {
    text-align: center;
    padding: 8rem 1rem 4rem;
}

header h1 {
    font-size: 3rem;
    font-weight: 700;
}

/* SECTIONS */
section {
    max-width: 900px;
    margin: auto;
    padding: 4rem 1.5rem;
}

h2 {
    font-size: 2rem;
    margin-bottom: 1rem;
    color: #38bdf8;
}

/* PROJECTS */

    display: grid;

}
